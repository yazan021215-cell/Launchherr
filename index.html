
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>POWER Launcher</title>
<style>
* { box-sizing: border-box; }
body {
  margin: 0;
  background: #090909;
  color: white;
  font-family: Arial, sans-serif;
  padding: 25px;
}
header {
  color: #ffcc00;
  font-size: 28px;
  font-weight: bold;
  margin: 20px 0 35px;
}
.card {
  background: #171717;
  border: 1px solid #333;
  border-radius: 14px;
  padding: 20px;
  margin-bottom: 18px;
}
select {
  width: 100%;
  padding: 14px;
  background: #252525;
  color: white;
  border: 1px solid #444;
  border-radius: 8px;
}
button {
  width: 100%;
  padding: 16px;
  background: #ffcc00;
  color: black;
  border: none;
  border-radius: 9px;
  font-size: 18px;
  font-weight: bold;
}
small { color: #999; }
</style>
</head>
<body>

<header>⚡ POWER</header>
<p>MINECRAFT JAVA LAUNCHER</p>

<div class="card">
  <h3>Game Version</h3>
  <select>
    <option>1.21.11</option>
    <option>1.21.8</option>
    <option>1.20.1</option>
  </select>
</div>

<div class="card">
  <h3>Account</h3>
  <small>Microsoft account integration coming soon</small>
</div>

<div class="card">
  <h3>Launcher</h3>
  <button onclick="alert('POWER Launcher interface ready!')">
    PLAY
  </button>
</div>

<p style="text-align:center;color:#777">
POWER NETWORK • UNOFFICIAL PROJECT
</p>

</body>
</html>
